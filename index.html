<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07131b">
<meta property="og:title" content="Kagura Atlas">
<meta property="og:description" content="An interactive map of the Kagura region.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>&#127796;</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<title>Kagura Atlas</title>
<meta name="description" content="An interactive map of the Kagura region. Drag to explore, scroll to zoom, click anywhere to see what is there.">
<style>
	:root {
		--ink: #07131b; --panel: #102029; --panel2: #0b1a22; --line: #24424f;
		--text: #e8eff3; --soft: #93acb8; --gold: #e8b33c; --red: #d63a3a; --sea: #3a62b4;
		--shadow: 0 18px 40px -22px #000;
	}
	* { box-sizing: border-box; }
	body {
		margin: 0; background: var(--ink); color: var(--text); overflow: hidden;
		font-family: "Zen Kaku Gothic New", system-ui, -apple-system, sans-serif;
		line-height: 1.55; -webkit-font-smoothing: antialiased;
	}
	.mono { font-family: "Silkscreen", ui-monospace, monospace; }

	/* ---- the map fills the window; everything else floats over it --------- */
	/* One root with real height: the page is hosted in a frame that sizes to its
	   content, and fixed-position children measure as zero. */
	#app {
		position: relative; width: 100%; height: 100vh; height: 100dvh;
		overflow: hidden; background: var(--ink);
	}
	#stage {
		position: absolute; inset: 0; overflow: hidden; touch-action: none;
		cursor: grab; background: #0a1b3a;
	}
	#stage.grabbing { cursor: grabbing; }
	#map {
		position: absolute; inset: 0; width: 100%; height: 100%;
		display: block;
	}
	#markers { position: absolute; inset: 0; pointer-events: none; }

	/* Markers keep their size at every zoom, so the map can breathe. */
	.mk {
		position: absolute; top: 0; left: 0; pointer-events: auto; cursor: pointer;
		background: none; border: 0; padding: 0; display: flex; align-items: center; gap: 6px;
		margin: -7px 0 0 -7px; font: inherit; color: #fff; white-space: nowrap;
	}
	.mk > i {
		width: 14px; height: 14px; flex: 0 0 14px; border-radius: 50%;
		background: #f6f2e6; border: 3px solid #14313f; box-shadow: 0 2px 0 #0007;
		font-family: "Silkscreen", monospace; font-size: 8px; font-style: normal;
		color: #14313f; display: grid; place-items: center; transition: transform .12s;
	}
	.mk.gym > i { background: var(--gold); border-color: #6b4a08; }
	.mk.wild > i { background: #7fd27a; border-color: #2c5d33; width: 11px; height: 11px; flex-basis: 11px; }
	.mk.wild > span { background: rgba(14, 34, 22, .82); }
	.mk.rte > i { width: 13px; height: 13px; flex-basis: 13px; border-radius: 3px; background: #e8d29e; }
	.mk:hover > i, .mk.on > i { transform: scale(1.35); }
	.mk.on > i { background: var(--red); border-color: #fff; }
	.mk > span {
		font-family: "Silkscreen", monospace; font-size: 10px; opacity: 0;
		background: rgba(8, 18, 26, .84); padding: 3px 6px; transition: opacity .18s;
		text-shadow: 0 1px 0 #000; pointer-events: none;
	}
	.mk.named > span, .mk:hover > span, .mk.on > span { opacity: 1; }

	/* Weight by importance, so towns win the eye against wild ground. */
	.mk.r1 > i { width: 17px; height: 17px; flex-basis: 17px; border-width: 3px; }
	.mk.r1 > span { font-size: 11px; background: rgba(6, 14, 20, .92); padding: 4px 7px; }
	.mk.r2 > i { width: 13px; height: 13px; flex-basis: 13px; }
	.mk.r2 > span { font-size: 9.5px; opacity: 0; }
	.mk.r3 > i { width: 9px; height: 9px; flex-basis: 9px; border-width: 2px; }
	.mk.r3 > span { font-size: 8.5px; color: #cfe3d6; background: rgba(8, 20, 14, .78); }
	.mk.r2.named > span, .mk.r3.named > span { opacity: 1; }
	.isle, .sea {
		position: absolute; top: 0; left: 0; transform-origin: 0 0; pointer-events: none;
		font-family: "Silkscreen", monospace; margin: -8px 0 0 -40px; width: 80px;
		text-align: center; transition: opacity .25s;
	}
	.isle { font-size: 13px; color: #fff6d8; text-shadow: 0 2px 0 #16305c, 0 0 8px #0b1f44; letter-spacing: 1px; }
	.sea.river { font-size: 8px; color: #a9dcef; letter-spacing: 1px; }
	.sea  { font-size: 10px; color: #cfeaf4; text-shadow: 0 2px 0 #16305c; letter-spacing: 2px; }

	/* ---- floating chrome ------------------------------------------------- */
	.brand {
		position: absolute; top: 14px; left: 14px; z-index: 5; display: flex; align-items: center;
		gap: 10px; background: rgba(10, 22, 30, .88); border: 1px solid var(--line);
		padding: 9px 14px; box-shadow: var(--shadow); backdrop-filter: blur(6px);
	}
	.brand b { font-family: "Silkscreen", monospace; font-size: 12px; color: var(--gold); }
	.brand span { font-family: "Silkscreen", monospace; font-size: 10px; color: var(--soft); }

	#nametag {
		position: absolute; top: 14px; right: 14px; z-index: 5; display: flex; align-items: center;
		gap: 10px; background: rgba(10, 22, 30, .9); border: 1px solid var(--line);
		padding: 10px 16px 10px 12px; box-shadow: var(--shadow); backdrop-filter: blur(6px);
		opacity: 0; transform: translateY(-6px); transition: opacity .2s, transform .2s;
	}
	#nametag.on { opacity: 1; transform: none; }
	#nametag i { width: 3px; height: 18px; background: var(--gold); display: block; }
	#nametag b { font-family: "Silkscreen", monospace; font-size: 12px; }
	#nametag u {
		font-family: "Silkscreen", monospace; font-size: 8px; text-decoration: none;
		color: #cbd9e0; background: #2c3a6e; padding: 3px 5px;
	}

	.ctl {
		position: absolute; z-index: 5; display: flex; gap: 6px;
		background: rgba(10, 22, 30, .88); border: 1px solid var(--line);
		padding: 6px; box-shadow: var(--shadow); backdrop-filter: blur(6px);
	}
	.ctl.zoom { left: 14px; bottom: 14px; flex-direction: column; }
	.ctl button {
		width: 34px; height: 34px; cursor: pointer; background: transparent; color: var(--text);
		border: 1px solid transparent; font-family: "Silkscreen", monospace; font-size: 13px;
	}
	.ctl button:hover { border-color: var(--gold); color: var(--gold); }
	#regionList { position: absolute; left: 62px; bottom: 14px; z-index: 5; display: flex; gap: 6px; }
	#regionList button {
		font-family: "Silkscreen", monospace; font-size: 10px; cursor: pointer;
		background: rgba(10, 22, 30, .88); color: var(--soft); border: 1px solid var(--line);
		padding: 9px 13px; backdrop-filter: blur(6px);
	}
	#regionList button:hover { color: var(--text); border-color: var(--gold); }
	#regionList button.on { background: var(--gold); color: #241a06; border-color: var(--gold); }

	.tip {
		position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 4;
		font-size: 12px; color: var(--soft); background: rgba(10, 22, 30, .8);
		border: 1px solid var(--line); padding: 7px 14px; pointer-events: none;
		backdrop-filter: blur(6px);
	}
	@media (max-width: 820px) { .tip { display: none; } }

	/* ---- the location panel slides in from the right ---------------------- */
	#panel {
		position: absolute; top: 0; right: 0; z-index: 6; width: min(380px, 92vw); height: 100%;
		background: var(--panel); border-left: 1px solid var(--line); box-shadow: var(--shadow);
		transform: translateX(102%); transition: transform .26s cubic-bezier(.3,.9,.3,1);
		display: flex; flex-direction: column;
	}
	#panel.open { transform: none; }
	#close {
		position: absolute; top: 10px; right: 10px; z-index: 2; width: 30px; height: 30px;
		cursor: pointer; background: rgba(8, 18, 26, .7); color: var(--text);
		border: 1px solid var(--line); font-family: "Silkscreen", monospace; font-size: 12px;
	}
	#close:hover { border-color: var(--gold); color: var(--gold); }
	#art { background: #06121a; flex: 0 0 auto; }
	#art img { display: block; width: 100%; height: auto; image-rendering: pixelated; }
	.noart {
		aspect-ratio: 3 / 2; display: flex; flex-direction: column; gap: 6px;
		align-items: center; justify-content: center; background: #0a161d;
	}
	.noart b { font-family: "Silkscreen", monospace; font-size: 12px; color: var(--gold); }
	.noart span { font-size: 12px; color: var(--soft); }
	#detail { padding: 16px; overflow-y: auto; flex: 1 1 auto; }

	.dhead { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
	.dhead h3 { font-family: "Silkscreen", monospace; font-size: 15px; margin: 0; }
	.dsub { font-family: "Silkscreen", monospace; font-size: 9px; color: var(--soft); margin: 7px 0 0; text-transform: uppercase; }
	.dblurb { margin: 11px 0 0; font-size: 13.5px; }
	.dlabel { font-family: "Silkscreen", monospace; font-size: 9px; color: var(--soft); margin: 16px 0 7px; }
	.facts { margin: 0; padding-left: 16px; font-size: 13px; color: var(--soft); }
	.todo { margin: 0; padding-left: 16px; font-size: 13px; }
	.todo li, .facts li { margin-bottom: 3px; }
	.chips { display: flex; flex-wrap: wrap; gap: 5px; }
	.ty {
		font-family: "Silkscreen", monospace; font-size: 8px; letter-spacing: .5px;
		background: #123041; border: 1px solid #2a5670; color: #9fd8ea; padding: 4px 7px;
	}
	.chans { display: flex; flex-wrap: wrap; gap: 5px; }
	.chan {
		font-family: "Silkscreen", monospace; font-size: 9.5px; background: var(--panel2);
		border: 1px solid var(--line); padding: 4px 6px; white-space: nowrap;
	}
	.chan.new { opacity: .66; }
	.tag { font-family: "Silkscreen", monospace; font-size: 8px; padding: 3px 5px; color: #fff; }
	.tag.tier { background: #3f4d8a; }
	.tag.gym { background: var(--gold); color: #2a2110; }
	.tag.gate { background: var(--sea); }
	.hook {
		margin: 0; font-size: 13px; border-left: 3px solid var(--red);
		padding: 6px 0 6px 10px; background: rgba(214, 58, 58, .09);
	}
	.gochan {
		display: flex; align-items: center; gap: 9px; width: 100%; margin: 12px 0 0;
		padding: 10px 12px; cursor: pointer; text-align: left;
		background: var(--panel2); border: 1px solid var(--line); color: var(--text);
	}
	.gochan:hover { border-color: var(--gold); }
	.gochan i { font-family: "Silkscreen", monospace; font-size: 8px; color: var(--soft); font-style: normal; }
	.gochan b { font-family: "Silkscreen", monospace; font-size: 12px; color: var(--gold); flex: 1 1 auto; }
	.gochan u { font-family: "Silkscreen", monospace; font-size: 8px; color: var(--soft); text-decoration: none; }
	.gymdoor {
		display: block; width: 100%; margin: 12px 0 2px; padding: 12px; cursor: pointer;
		font-family: "Silkscreen", monospace; font-size: 10px; letter-spacing: .5px;
		background: var(--gold); color: #241a06; border: 2px solid #f7d37a;
	}
	.gymdoor:hover { background: #f7d37a; }
	.gymdoor.back { background: var(--panel2); color: var(--soft); border-color: var(--line); }
	.gymdoor.back:hover { color: var(--text); border-color: var(--gold); }
</style>
</head>
<body>
<div id="app">
<div id="stage">
	<canvas id="map"></canvas>
	<div id="markers"></div>
</div>

<div class="brand">
	<b>KAGURA ATLAS</b>
	<span id="regionName">Kagura</span>
</div>

<div id="nametag"><i></i><b></b></div>

<div class="ctl zoom">
	<button id="zin" title="Zoom in">+</button>
	<button id="zout" title="Zoom out">&minus;</button>
	<button id="zfit" title="Whole region">&#9633;</button>
</div>

<div id="regionList"></div>

<p class="tip">Drag to move &middot; scroll to zoom &middot; click a marker</p>

<aside id="panel">
	<button id="close" title="Close">&times;</button>
	<div id="art"></div>
	<div id="detail"></div>
</aside>
</div>

<script src="regions/kagura.js"></script>
<script src="atlas.js"></script>
</body>
</html>
